[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tswitch"
version = "0.1.0"
description = "A typesafe switch statement for Python"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sanjay" }]
keywords = ["switch", "typesafe", "ai", "llm", "classification"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "typesafe-sdk>=0.7.0,<0.8",
]

[project.urls]
Homepage = "https://github.com/svsaraf/tswitch"
Repository = "https://github.com/svsaraf/tswitch"
Issues = "https://github.com/svsaraf/tswitch/issues"
PyPI = "https://pypi.org/project/tswitch/"

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tswitch = ["py.typed"]
